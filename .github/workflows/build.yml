name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create . --platforms=android --org com.example --project-name group_rider
      - run: >
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/><uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/><uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/><application#'
          android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - name: Build APK (retry on network errors)
        run: |
          for i in 1 2 3 4 5; do
            flutter build apk --release && break
            echo "Build failed, retrying in 60 seconds..."
            sleep 60
          done
          test -f build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: group-rider-apk
          path: build/app/outputs/flutter-apk/app-release.apk
